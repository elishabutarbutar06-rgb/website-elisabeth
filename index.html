<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Bayang-Bayang Karsa — Elisabeth</title>

<meta name="description"
content="Bayang-Bayang Karsa, sebuah novel tentang rahasia, keluarga, kekuasaan, pengkhianatan, dan perjalanan menemukan jati diri.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia, 'Times New Roman', serif;
    background:#0b0b0d;
    color:#eeeeee;
    line-height:1.7;
}

/* NAVBAR */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(11,11,13,.95);
    border-bottom:1px solid #332126;
    backdrop-filter:blur(10px);
}

.nav-container{
    max-width:1100px;
    margin:auto;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#c73558;
    font-size:22px;
    font-weight:bold;
    letter-spacing:1px;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#dddddd;
    text-decoration:none;
    font-size:14px;
}

.nav-links a:hover{
    color:#d94667;
}

/* HERO */

.hero{
    min-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 25px;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(circle at 50% 20%,
    rgba(160,20,50,.28),
    transparent 35%),

    radial-gradient(circle at 80% 80%,
    rgba(120,20,40,.15),
    transparent 35%),

    #0b0b0d;
}

.hero-content{
    max-width:850px;
    position:relative;
    z-index:2;
}

.small-title{
    color:#c73558;
    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(48px,9vw,95px);
    line-height:1;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:25px;

    background:linear-gradient(
        120deg,
        #ffffff,
        #c73558,
        #ffffff
    );

    -webkit-background-clip:text;
    color:transparent;
}

.hero-subtitle{
    font-size:20px;
    color:#bbbbbb;
    max-width:650px;
    margin:0 auto 35px;
}

.author{
    color:#c73558;
    font-size:17px;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn-primary{
    background:#b52d50;
    color:white;
}

.btn-primary:hover{
    background:#d33b61;
    transform:translateY(-2px);
}

.btn-secondary{
    border:1px solid #61303d;
    color:#eeeeee;
}

.btn-secondary:hover{
    background:#241318;
}

/* SECTION */

section{
    max-width:1050px;
    margin:auto;
    padding:90px 25px;
}

.section-label{
    color:#c73558;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.section-title{
    font-size:38px;
    margin-bottom:20px;
}

.section-description{
    color:#aaaaaa;
    max-width:700px;
    margin-bottom:35px;
}

/* SINOPSIS */

.synopsis{
    background:#101014;
}

.synopsis-box{
    border-left:3px solid #b52d50;
    padding:25px 30px;
    background:#141419;
    border-radius:0 10px 10px 0;
}

.synopsis-box p{
    color:#cccccc;
    margin-bottom:15px;
}

/* QUOTE */

.quote{
    text-align:center;
    padding:100px 25px;
    background:
    linear-gradient(
        rgba(20,5,10,.8),
        rgba(20,5,10,.8)
    ),
    #170c10;
}

.quote-text{
    max-width:750px;
    margin:auto;
    font-size:30px;
    font-style:italic;
    color:#eeeeee;
}

.quote-author{
    margin-top:20px;
    color:#c73558;
}

/* CHAPTERS */

.chapter-list{
    display:grid;
    gap:15px;
}

.chapter{
